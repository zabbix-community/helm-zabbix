{{- if and .Values.zabbixServer.enabled .Values.zabbixServer.zabbixServerHA.enabled }}
{{- /* Binds the role of the database initialization/upgrade job to its service account. Hook, like both. */}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ template "zabbix.fullname" . }}-create-upgrade-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zabbix.labels" . | nindent 4 }}
    app.kubernetes.io/component: create-upgrade-db
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- range $key,$value := .Values.zabbixServer.zabbixServerHA.roleBinding.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
subjects:
- kind: ServiceAccount
  name: {{ template "zabbix.fullname" . }}-create-upgrade-db
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ template "zabbix.fullname" . }}-create-upgrade-db
  apiGroup: rbac.authorization.k8s.io
{{- end }}
