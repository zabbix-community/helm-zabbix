{{- if not .Values.postgresAccess.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "zabbix.fullname" . }}-db-access
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    {{- include "zabbix.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $fullname := include "zabbix.fullname" . }}
  {{- $secretHost := .Values.postgresAccess.host | b64enc }}
  {{- $secretPort := .Values.postgresAccess.port | toString | b64enc }}
  {{- if .Values.postgresql.enabled }}
  {{- $secretHost = printf "%s-postgresql" $fullname | b64enc }}
  {{- $secretPort = .Values.postgresql.service.port | toString | b64enc }}
  {{- end }}
  {{- $secretDbname := default "zabbix" .Values.postgresAccess.database | b64enc }}
  {{- $secretUser := default "zabbix" .Values.postgresAccess.user | b64enc }}
  {{- /* Without an explicit password, keep the one generated in the first installation */}}
  {{- $secretPassword := "" }}
  {{- if .Values.postgresAccess.password }}
  {{- $secretPassword = .Values.postgresAccess.password | b64enc }}
  {{- else }}
  {{- $secretObj := (lookup "v1" "Secret" .Release.Namespace (printf "%s-db-access" $fullname)) | default dict }}
  {{- $secretData := (get $secretObj "data") | default dict }}
  {{- $secretPassword = (get $secretData .Values.postgresAccess.secretPasswordKey) | default (randAlphaNum 16 | b64enc) }}
  {{- end }}
  {{- $secretSchema := "" }}
  {{- if and (not .Values.postgresql.enabled) .Values.postgresAccess.secretSchemaKey }}
  {{- $secretSchema = default "public" .Values.postgresAccess.schema | b64enc }}
  {{- end }}
  {{ .Values.postgresAccess.secretHostKey }}: {{ $secretHost | quote }}
  {{ .Values.postgresAccess.secretPortKey }}: {{ $secretPort | quote }}
  {{ .Values.postgresAccess.secretDBKey }}: {{ $secretDbname | quote }}
  {{ .Values.postgresAccess.secretUserKey }}: {{ $secretUser | quote }}
  {{ .Values.postgresAccess.secretPasswordKey }}: {{ $secretPassword | quote }}
  {{- if $secretSchema }}
  {{ .Values.postgresAccess.secretSchemaKey }}: {{ $secretSchema | quote }}
  {{- end }}
{{- end }}
