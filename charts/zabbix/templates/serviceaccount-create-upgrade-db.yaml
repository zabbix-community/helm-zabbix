{{- if and .Values.zabbixServer.enabled .Values.zabbixServer.zabbixServerHA.enabled }}
{{- /*
Service account of the database initialization/upgrade job. It is a pre-install/pre-upgrade hook with a weight lower
than the one of the job, so it exists before the job runs, also on the first "helm upgrade" with HA enabled and under
Argo CD (PreSync hook). Regular resources of the release are only created after the pre-install/pre-upgrade hooks.
*/}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ template "zabbix.fullname" . }}-create-upgrade-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zabbix.labels" . | nindent 4 }}
    app.kubernetes.io/component: create-upgrade-db
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- range $key,$value := .Values.zabbixServer.zabbixServerHA.serviceAccount.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
{{- end }}
