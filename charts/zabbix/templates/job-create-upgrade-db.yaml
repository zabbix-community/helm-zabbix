{{ if and .Values.zabbixServer.enabled .Values.zabbixServer.zabbixServerHA.enabled }}
{{ if and .Values.zabbixServer.zabbixServerHA.enabled .Values.postgresql.enabled }}
{{ fail "We do not support enabling Zabbix Server native High Availability combined with `postgresql.enabled=true`. Please bring your own database to use Zabbix Server HA!" }}
{{ end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "zabbix.fullname" . }}-create-upgrade-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zabbix.labels" . | nindent 4 }}
    app.kubernetes.io/component: create-upgrade-db
    {{- if .Values.zabbixServer.zabbixServerHA.dbCreateUpgradeJob.jobLabels }}
    {{- toYaml .Values.zabbixServer.zabbixServerHA.dbCreateUpgradeJob.jobLabels | nindent 4 }}
    {{- end }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    # before-hook-creation: a job of a failed run doesn't block the next "helm upgrade" with "already exists"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- range $key,$value := .Values.zabbixServer.zabbixServerHA.dbCreateUpgradeJob.jobAnnotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 120
  {{- with .Values.zabbixServer.zabbixServerHA.dbCreateUpgradeJob.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  template:
    spec:
      {{- with .Values.zabbixServer.zabbixServerHA.dbCreateUpgradeJob.extraPodSpecs }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.zabbixServer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.zabbixServer.zabbixServerHA.dbCreateUpgradeJob.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}      
      # always set, also on install: under Argo CD (helm template) .Release.IsUpgrade is always false
      serviceAccountName: {{ template "zabbix.fullname" . }}-create-upgrade-db
      containers:
      {{- with .Values.zabbixServer.zabbixServerHA.dbCreateUpgradeJob.extraContainers }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      - name: create-upgrade-db
        {{- $pattern := "[0-9]+\\.[0-9]+" -}}
        {{- $tag := "" -}}
        {{- /* A tagSuffix without quotes (e.g. --set ...tagSuffix=20261107172746) is a number: int64 with --set and
        float64 in a values file. Convert it to a string of digits, never "%!s(int64=...)" or "2.02e+13" (issue #2 of
        helm-zabbix-image-db-init-upgrade-job) */ -}}
        {{- $suffix := .Values.zabbixServer.zabbixServerHA.dbCreateUpgradeJob.image.tagSuffix -}}
        {{- if or (kindIs "float64" $suffix) (kindIs "int64" $suffix) (kindIs "int" $suffix) -}}
          {{- $suffix = int64 $suffix -}}
        {{- end -}}
        {{- $suffix = toString $suffix -}}
        {{- if .Values.zabbixServer.zabbixServerHA.dbCreateUpgradeJob.image.tag }}
          {{- $tag = .Values.zabbixServer.zabbixServerHA.dbCreateUpgradeJob.image.tag }}
        {{- else if .Values.zabbixServer.image.tag }}
          {{- $zabbixTag := .Values.zabbixServer.image.tag -}}
          {{- $match := regexFind $pattern $zabbixTag -}}
          {{- if $match }}
            {{- $tag = printf "%s-%s" $match $suffix -}}
          {{- end }}
        {{- else }}
          {{- $globalTag := .Values.zabbixImageTag -}}
          {{- $match := regexFind $pattern $globalTag -}}
          {{- if $match }}
            {{- $tag = printf "%s-%s" $match $suffix -}}
          {{- end }}
        {{- end }}
        {{- if eq $tag "" }}
          {{- fail (printf "Could not get the Zabbix major version (e.g. 8.0) from the image tag %q to choose the image of the database initialization/upgrade job. Set zabbixServer.zabbixServerHA.dbCreateUpgradeJob.image.tag explicitly. Development (trunk) images are not supported with Zabbix Server HA." (default .Values.zabbixImageTag .Values.zabbixServer.image.tag)) -}}
        {{- else }}
        image: "{{ .Values.zabbixServer.zabbixServerHA.dbCreateUpgradeJob.image.repository }}:{{ $tag }}"
        {{- end }}
        {{- if .Values.zabbixServer.zabbixServerHA.dbCreateUpgradeJob.image.pullPolicy }}
        imagePullPolicy: {{ .Values.zabbixServer.zabbixServerHA.dbCreateUpgradeJob.image.pullPolicy }}
        {{- end }}
        securityContext:
          {{- toYaml .Values.zabbixServer.zabbixServerHA.dbCreateUpgradeJob.securityContext | nindent 10 }}
        resources:
          {{- toYaml .Values.zabbixServer.zabbixServerHA.dbCreateUpgradeJob.resources | nindent 10 }}
        env:
          - name: ZBX_SERVER_DEPLOYMENT_NAME
            value: {{ template "zabbix.fullname" . }}-zabbix-server
          # auto: the job checks whether the Zabbix Server deployment exists to know if it is an install or an upgrade.
          # .Release.IsUpgrade can't be used, because it is always false under Argo CD and "helm template"
          - name: HELM_HOOK_TYPE
            value: {{ .Values.zabbixServer.zabbixServerHA.dbCreateUpgradeJob.hookType | default "auto" | quote }}
          - name: JOB_WAIT_TIMEOUT
            value: {{ .Values.zabbixServer.zabbixServerHA.dbCreateUpgradeJob.waitTimeout | default 900 | quote }}
          {{- include "zabbix.postgresAccess.variables" (list $ . "db_init_upgrade") | nindent 10 }}
          {{- with .Values.zabbixServer.extraEnv }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- with .Values.zabbixServer.zabbixServerHA.dbCreateUpgradeJob.extraVolumeMounts }}
        volumeMounts:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        args:
          - init_and_upgrade_db
      imagePullSecrets:
      {{- range .Values.zabbixServer.zabbixServerHA.dbCreateUpgradeJob.image.pullSecrets }}
        - name: {{ . | quote }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      {{- with .Values.zabbixServer.zabbixServerHA.dbCreateUpgradeJob.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{ end }}
