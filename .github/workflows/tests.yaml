      - name: Run helm test alpine-8.0-latest
        run: |
          kubectl --namespace zabbix get pods -o ${{ env.COLUMN_OPTIONS }}
          helm test --namespace zabbix zabbix

      - name: Run Helm upgrade back to default image (AppVersion)
        run: |
          helm upgrade --wait --namespace zabbix zabbix ${{ env.VALUES_SET }} ./charts/zabbix

      - name: Run helm test AppVersion after upgrades
        run: |
          kubectl --namespace zabbix get pods -o ${{ env.COLUMN_OPTIONS }}
          helm test --namespace zabbix zabbix

      - name: Run helm uninstall
        run: |
          helm uninstall --wait zabbix --namespace zabbix


  # Transition from a standalone Zabbix Server to Zabbix Server HA with "helm upgrade" (issues #201 and #231): the
  # pre-upgrade job must have its service account before the regular resources exist, scale the standalone Zabbix
  # Server down and remove its row from the ha_node table
  test_extdb_standalone_to_ha:
    runs-on: ubuntu-latest
    needs: [codespell, lint]
    env:
      COLUMN_OPTIONS: 'custom-columns="NAME:.metadata.name,READY:.status.containerStatuses[*].ready,STATUS:.status.phase,RESTARTS:.status.containerStatuses[*].restartCount,IP:.status.podIP,ROLE:.metadata.labels.zabbix\.com/server-ha-role,IMAGE:.spec.containers[*].image"'
      VALUES_SET: '--set postgresAccess.existingSecretName=db-access --set postgresql.enabled=false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Kind
        uses: helm/kind-action@v1.15.2

      - name: Install Helm and kubectl with mise
        uses: jdx/mise-action@v5

      - name: Show tool versions
        run: |
          helm version
          kubectl version --client

      - name: Create Namespace in Kind
        run: |
          kubectl create namespace zabbix

      - name: Create simple postgresql database for testing
        run: |
          kubectl --namespace zabbix run postgres --image=postgres:18 --env="POSTGRES_PASSWORD=zabbix123" --env="POSTGRES_DB=zabbix" --env="POSTGRES_USER=zabbix" --port=5432
          kubectl --namespace zabbix wait --for=condition=ready pod -l run=postgres --timeout=60s
          kubectl --namespace zabbix expose pod postgres

      - name: Create postgres secret (existingSecret)
        run: |
          kubectl --namespace zabbix create secret generic db-access --from-literal host=postgres --from-literal port=5432 --from-literal user=zabbix --from-literal password=zabbix123 --from-literal dbname=zabbix

      - name: Run Helm install without HA (standalone Zabbix Server)
        run: |
          helm install --wait --namespace zabbix zabbix ${{ env.VALUES_SET }} ./charts/zabbix

      - name: Wait for the standalone Zabbix Server in the ha_node table
        run: |
          # The command runs in a new shell: the single quotes are intentional
          # shellcheck disable=SC2016
          timeout 120 bash -c 'until [ "$(kubectl --namespace zabbix exec postgres -- psql -U zabbix -d zabbix -tAc "SELECT COUNT(*) FROM ha_node WHERE name='"''"' AND status=3")" = 1 ]; do sleep 3; done'

      - name: Run Helm upgrade enabling HA
        run: |
          helm upgrade --wait --namespace zabbix zabbix ${{ env.VALUES_SET }} --set zabbixServer.zabbixServerHA.enabled=true --set zabbixServer.replicaCount=2 ./charts/zabbix

      - name: Check the active and standby Zabbix Server pods
        run: |
          # The command runs in a new shell: the single quotes are intentional
          # shellcheck disable=SC2016
          timeout 180 bash -c 'until [ "$(kubectl --namespace zabbix get pods -l zabbix.com/server-ha-role=active -o name | wc -l)" = 1 ] && [ "$(kubectl --namespace zabbix get pods -l zabbix.com/server-ha-role=standby -o name | wc -l)" = 1 ]; do sleep 3; done'
          kubectl --namespace zabbix get pods -o ${{ env.COLUMN_OPTIONS }}
          kubectl --namespace zabbix exec postgres -- psql -U zabbix -d zabbix -c "SELECT name, address, status FROM ha_node"

      - name: Run helm test after the transition to HA
        run: |
          helm test --namespace zabbix zabbix

      - name: Run helm uninstall
        run: |
          helm uninstall --wait zabbix --namespace zabbix
