name: Release Charts

# References:
# https://blog.bradmccoy.io/linking-helm-charts-in-github-pages-to-artifacthub-46e02e19abfe
# https://github.com/helm/chart-releaser-action
# https://helm.sh/docs/howto/chart_releaser_action/
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
# https://helm.sh/docs/topics/registries/
#
# The release publishes the chart in two places:
# - the Helm repository https://zabbix-community.github.io/helm-zabbix (GitHub Release "zabbix-x.y.z" and gh-pages),
#   via chart-releaser;
# - the OCI registry oci://ghcr.io/zabbix-community/charts/zabbix, after chart-releaser succeeds, so both
#   always publish the same versions.

on:
  push:
    # Sequence of patterns matched against refs/heads
    #branches:
    #  - main
    # Sequence of patterns matched against refs/tags
    tags:
      - '*'

jobs:
  release:
    # depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write
      # Push the chart to the OCI registry ghcr.io
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm with mise
        uses: jdx/mise-action@v5
        with:
          install_args: helm
          # Don't restore tools from a cache in a job that publishes releases
          cache: false

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.9.0
        with:
          charts_dir: charts
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Publish the chart to the OCI registry
        env:
          OCI_REPOSITORY: "oci://ghcr.io/${{ github.repository_owner }}/charts"
          REGISTRY_USER: "${{ github.actor }}"
          REGISTRY_PASSWORD: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          set -euo pipefail
          chart_version="$(helm show chart charts/zabbix | sed -n 's/^version: *//p')"
          echo "${REGISTRY_PASSWORD}" | helm registry login ghcr.io --username "${REGISTRY_USER}" --password-stdin
          # Published versions are immutable: never overwrite one
          if helm show chart "${OCI_REPOSITORY}/zabbix" --version "${chart_version}" >/dev/null 2>&1; then
            echo "The version ${chart_version} is already published in ${OCI_REPOSITORY}/zabbix"
            exit 0
          fi
          helm package charts/zabbix --destination "${RUNNER_TEMP}/oci"
          helm push "${RUNNER_TEMP}/oci/zabbix-${chart_version}.tgz" "${OCI_REPOSITORY}"
          helm show chart "${OCI_REPOSITORY}/zabbix" --version "${chart_version}"
